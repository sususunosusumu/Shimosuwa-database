
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下諏訪町 防火水槽・消火栓マップ</title>
  <meta name="description" content="下諏訪町の防火水槽、地下式消火栓、地上式消火栓の位置を地図上で確認できるマップです。" />
  <meta name="keywords" content="下諏訪町,防火水槽,消火栓,地上式消火栓,地下式消火栓,GIS,地図" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <style>
    :root {
      --blue: #2563eb;
      --red: #dc2626;
      --orange: #f97316;
      --ink: #0f172a;
      --muted: #64748b;
      --bg: #f8fafc;
      --card: rgba(255,255,255,.96);
      --line: #e2e8f0;
      --header-h: 118px;
      --side-w: 380px;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }

    header {
      position: fixed; inset: 0 0 auto 0; height: var(--header-h); z-index: 1000;
      padding: 24px 28px 18px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      box-shadow: 0 2px 8px rgba(15,23,42,.18);
    }
    header h1 { margin: 0 0 8px; font-size: clamp(24px, 2.6vw, 36px); letter-spacing: .02em; }
    header p { margin: 0; color: #cbd5e1; font-size: 15px; }

    aside {
      position: fixed; left: 0; top: var(--header-h); bottom: 0; width: var(--side-w); z-index: 900;
      padding: 18px;
      background: #ffffff;
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    #map {
      position: fixed;
      left: var(--side-w);
      right: 0;
      top: var(--header-h);
      bottom: 0;
      z-index: 1;
      background: #dbeafe;
    }

    .panel { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; background: var(--card); box-shadow: 0 8px 24px rgba(15,23,42,.06); }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    .filter-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid #f1f5f9; cursor: pointer; user-select: none; font-size: 16px; }
    .filter-row:last-child { border-bottom: 0; }
    .filter-row input { transform: scale(1.18); }
    .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 3px rgba(15,23,42,.08); }
    .blue { background: var(--blue); } .red { background: var(--red); } .orange { background: var(--orange); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    button { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; background: white; color: var(--ink); font-weight: 700; cursor: pointer; font-size: 14px; }
    button:hover { background: #f1f5f9; }
    .count-grid { display: grid; gap: 9px; }
    .count-card { display: flex; justify-content: space-between; align-items: center; padding: 11px 13px; border-radius: 12px; background: #f8fafc; border: 1px solid #eef2f7; font-size: 14px; }
    .count-card strong { font-size: 22px; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .popup-title { font-weight: 800; margin-bottom: 4px; }
    .popup-line { font-size: 12px; color: #475569; margin: 2px 0; }
    .status { position: fixed; right: 16px; bottom: 16px; z-index: 1200; background: rgba(15,23,42,.9); color: white; border-radius: 12px; padding: 10px 12px; font-size: 13px; }
    .status.hidden { display: none; }

    @media (max-width: 760px) {
      :root { --header-h: 104px; --side-w: 0px; }
      html, body { overflow: auto; }
      header { position: relative; height: auto; }
      aside { position: relative; top: auto; bottom: auto; width: 100%; max-height: 310px; border-right: 0; border-bottom: 1px solid var(--line); }
      #map { position: relative; left: auto; top: auto; right: auto; bottom: auto; width: 100%; height: 68vh; min-height: 430px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>下諏訪町 防火水槽・消火栓マップ</h1>
    <p>防火水槽・地下式消火栓・地上式消火栓の位置を地図上で確認できます。</p>
  </header>

  <aside>
    <section class="panel">
      <h2>表示切替</h2>
      <label class="filter-row"><input type="checkbox" id="toggle-tanks" checked><span class="dot blue"></span><span>防火水槽</span></label>
      <label class="filter-row"><input type="checkbox" id="toggle-underground" checked><span class="dot red"></span><span>地下式消火栓</span></label>
      <label class="filter-row"><input type="checkbox" id="toggle-ground" checked><span class="dot orange"></span><span>地上式消火栓</span></label>
      <div class="actions"><button type="button" id="show-all">すべて表示</button><button type="button" id="hide-all">すべて非表示</button></div>
    </section>

    <section class="panel">
      <h2>件数</h2>
      <div class="count-grid">
        <div class="count-card"><span>防火水槽</span><strong id="count-tanks">-</strong></div>
        <div class="count-card"><span>地下式消火栓</span><strong id="count-underground">-</strong></div>
        <div class="count-card"><span>地上式消火栓</span><strong id="count-ground">-</strong></div>
        <div class="count-card"><span>表示中 合計</span><strong id="count-visible">-</strong></div>
      </div>
    </section>

    <section class="panel">
      <h2>凡例</h2>
      <p class="note">青：防火水槽<br>赤：地下式消火栓<br>オレンジ：地上式消火栓<br><br>マーカーをクリックすると、種別・番号・緯度経度を確認できます。</p>
    </section>
  </aside>

  <div id="map"></div>
  <div id="status" class="status">地図を読み込み中...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const DATASETS = {
      tanks: { label: "防火水槽", color: "#2563eb", file: "./GIS/shimosuwa_fire_water_tanks.json", checkboxId: "toggle-tanks", countId: "count-tanks", group: null, total: 0 },
      underground: { label: "地下式消火栓", color: "#dc2626", file: "./GIS/shimosuwa_underground_hydrants.json", checkboxId: "toggle-underground", countId: "count-underground", group: null, total: 0 },
      ground: { label: "地上式消火栓", color: "#f97316", file: "./GIS/shimosuwa_ground_hydrants.json", checkboxId: "toggle-ground", countId: "count-ground", group: null, total: 0 }
    };

    let map;
    let allBounds = [];
    const statusEl = document.getElementById("status");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function getLatLng(item) {
      const lat = Number(item.latitude ?? item.center_latitude);
      const lng = Number(item.longitude ?? item.center_longitude);
      return Number.isFinite(lat) && Number.isFinite(lng) ? [lat, lng] : null;
    }

    function getNo(item) { return item.tank_no || item.hydrant_no || item.no || item.uid || ""; }

    function makePopup(item, label) {
      const no = getNo(item);
      const latlng = getLatLng(item);
      const address = item.address ? `<div class="popup-line">住所：${escapeHtml(item.address)}</div>` : "";
      return `<div class="popup-title">${escapeHtml(label)}${no ? " No." + escapeHtml(no) : ""}</div>${address}<div class="popup-line">緯度：${latlng[0].toFixed(6)}</div><div class="popup-line">経度：${latlng[1].toFixed(6)}</div>`;
    }

    async function loadDataset(key) {
      const ds = DATASETS[key];
      ds.group = L.layerGroup();
      try {
        const response = await fetch(ds.file, { cache: "no-store" });
        if (!response.ok) throw new Error(response.status + " " + response.statusText);
        const data = await response.json();
        let count = 0;
        data.forEach(item => {
          const latlng = getLatLng(item);
          if (!latlng) return;
          count++;
          allBounds.push(latlng);
          L.circleMarker(latlng, {
            radius: 7,
            color: "#ffffff",
            weight: 2,
            fillColor: ds.color,
            fillOpacity: 0.95
          }).bindPopup(makePopup(item, ds.label)).addTo(ds.group);
        });
        ds.total = count;
        document.getElementById(ds.countId).textContent = count;
        ds.group.addTo(map);
      } catch (e) {
        console.error("Failed to load", ds.file, e);
        document.getElementById(ds.countId).textContent = "失敗";
      }
    }

    function updateLayerVisibility() {
      let visibleTotal = 0;
      Object.values(DATASETS).forEach(ds => {
        const checked = document.getElementById(ds.checkboxId).checked;
        if (!ds.group) return;
        if (checked) {
          if (!map.hasLayer(ds.group)) ds.group.addTo(map);
          visibleTotal += ds.total;
        } else {
          if (map.hasLayer(ds.group)) map.removeLayer(ds.group);
        }
      });
      document.getElementById("count-visible").textContent = visibleTotal;
    }

    function fitMap() {
      map.invalidateSize(true);
      if (allBounds.length) {
        map.fitBounds(L.latLngBounds(allBounds), { padding: [36, 36], maxZoom: 15 });
      } else {
        map.setView([36.075, 138.085], 14);
      }
    }

    function setAll(checked) {
      Object.values(DATASETS).forEach(ds => document.getElementById(ds.checkboxId).checked = checked);
      updateLayerVisibility();
    }

    async function initMap() {
      map = L.map("map", { preferCanvas: true, zoomControl: true, attributionControl: true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);
      map.setView([36.075, 138.085], 14);

      await Promise.all(Object.keys(DATASETS).map(loadDataset));
      updateLayerVisibility();
      fitMap();
      setTimeout(fitMap, 200);
      setTimeout(fitMap, 800);
      statusEl.classList.add("hidden");

      Object.values(DATASETS).forEach(ds => document.getElementById(ds.checkboxId).addEventListener("change", updateLayerVisibility));
      document.getElementById("show-all").addEventListener("click", () => setAll(true));
      document.getElementById("hide-all").addEventListener("click", () => setAll(false));
      window.addEventListener("resize", () => setTimeout(fitMap, 100));
      if (window.ResizeObserver) new ResizeObserver(() => setTimeout(fitMap, 50)).observe(document.getElementById("map"));
    }

    window.addEventListener("load", () => {
      requestAnimationFrame(() => requestAnimationFrame(initMap));
    });
  </script>
</body>
</html>
