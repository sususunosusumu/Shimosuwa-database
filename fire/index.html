<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>下諏訪町 防火水槽・消火栓マップ</title>
<meta name="description" content="下諏訪町の防火水槽、地下式消火栓、地上式消火栓の位置を地図上で確認できるマップです。" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
*{box-sizing:border-box}
:root{
  --navy:#111827;
  --bg:#f8fafc;
  --line:#e5e7eb;
  --muted:#64748b;
  --blue:#2563eb;
  --red:#dc2626;
  --orange:#f97316;
}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#111827;
  background:var(--bg);
}
.top{
  height:112px;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 30px;
}
.top h1{font-size:30px;margin:0 0 8px;font-weight:900;letter-spacing:.02em}
.top p{margin:0;color:#cbd5e1;font-weight:600}
.legend{font-size:15px;white-space:nowrap;color:#e5e7eb}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 6px 0 14px;border:2px solid rgba(255,255,255,.9);vertical-align:-1px}
.blue{background:var(--blue)} .red{background:var(--red)} .orange{background:var(--orange)}
.layout{
  display:grid;
  grid-template-columns:420px minmax(0,1fr);
  height:calc(100vh - 112px);
  min-height:560px;
}
.side{
  background:#f8fafc;
  border-right:1px solid var(--line);
  padding:18px;
  overflow:auto;
  z-index:1000;
}
#map{
  width:100%;
  height:100%;
  min-height:560px;
  background:#dbeafe;
}
.card{
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 12px 30px rgba(15,23,42,.06);
}
.card h2{font-size:18px;margin:0 0 16px;font-weight:900}
.row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 2px;
  border-bottom:1px solid #eef2f7;
  font-size:18px;
  font-weight:700;
}
.row:last-child{border-bottom:0}
.row input{width:18px;height:18px;accent-color:#2563eb}
.marker-sample{
  width:18px;height:18px;border-radius:50%;
  border:2px solid rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  flex:none;
}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
button{
  border:1px solid var(--line);
  background:white;
  border-radius:14px;
  padding:13px 12px;
  font-weight:900;
  cursor:pointer;
  font-size:15px;
}
button:hover{background:#f1f5f9}
.count{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:#f8fafc;
  border:1px solid #edf2f7;
  border-radius:14px;
  padding:12px 14px;
  margin:10px 0;
}
.count span:first-child{font-size:15px;color:#334155;font-weight:700}
.count span:last-child{font-size:24px;font-weight:950}
.search{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 14px;
  font-size:16px;
  margin:4px 0 12px;
}
.note{
  font-size:13px;
  line-height:1.75;
  color:#64748b;
  margin:10px 0 0;
}
.warn{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  border-radius:14px;
  padding:12px 14px;
  font-size:13px;
  line-height:1.7;
}
.leaflet-container{font:inherit}
.leaflet-popup-content{font-size:14px;line-height:1.7}
.popup-title{font-size:16px;font-weight:900;margin-bottom:4px}
.popup-meta{color:#475569}
@media(max-width:900px){
  .top{height:auto;align-items:flex-start;gap:12px;padding:18px;flex-direction:column}
  .top h1{font-size:24px}
  .layout{grid-template-columns:1fr;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  #map{height:65vh;min-height:440px}
}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>下諏訪町 防火水槽・消火栓マップ</h1>
    <p>防火水槽・地下式消火栓・地上式消火栓の位置を地図上で確認できます。</p>
  </div>
  <div class="legend">
    <span class="dot blue"></span>防火水槽
    <span class="dot red"></span>地下式消火栓
    <span class="dot orange"></span>地上式消火栓
  </div>
</header>

<main class="layout">
  <aside class="side">
    <section class="card">
      <h2>表示切替</h2>
      <label class="row"><input type="checkbox" id="chk-tank" checked><span class="marker-sample" style="background:var(--blue)"></span>防火水槽</label>
      <label class="row"><input type="checkbox" id="chk-underground" checked><span class="marker-sample" style="background:var(--red)"></span>地下式消火栓</label>
      <label class="row"><input type="checkbox" id="chk-ground" checked><span class="marker-sample" style="background:var(--orange)"></span>地上式消火栓</label>
      <div class="buttons">
        <button id="showAll">すべて表示</button>
        <button id="hideAll">すべて非表示</button>
      </div>
    </section>

    <section class="card">
      <h2>検索</h2>
      <input id="search" class="search" placeholder="番号・種別で検索 例：防火水槽 / 12" />
      <p class="note">番号、種別、住所などに含まれる文字で絞り込みます。</p>
    </section>

    <section class="card">
      <h2>件数</h2>
      <div class="count"><span>防火水槽</span><span id="count-tank">0</span></div>
      <div class="count"><span>地下式消火栓</span><span id="count-underground">0</span></div>
      <div class="count"><span>地上式消火栓</span><span id="count-ground">0</span></div>
      <div class="count"><span>表示中 合計</span><span id="count-total">0</span></div>
    </section>

    <section class="card">
      <h2>座標について</h2>
      <div class="warn">
        下諏訪町GIS由来の緯度経度は、そのままLeaflet/OpenStreetMapへ重ねると位置がずれるため、
        日本測地系からWGS84相当へ補正して表示しています。
      </div>
    </section>
  </aside>

  <div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const DATASETS = [
  {
    key:'tank',
    label:'防火水槽',
    file:'./GIS/shimosuwa_fire_water_tanks.json',
    color:'#2563eb',
    checkId:'chk-tank',
    countId:'count-tank',
    numberKeys:['tank_no','no','No','id','uid']
  },
  {
    key:'underground',
    label:'地下式消火栓',
    file:'./GIS/shimosuwa_underground_hydrants.json',
    color:'#dc2626',
    checkId:'chk-underground',
    countId:'count-underground',
    numberKeys:['hydrant_no','no','No','id','uid']
  },
  {
    key:'ground',
    label:'地上式消火栓',
    file:'./GIS/shimosuwa_ground_hydrants.json',
    color:'#f97316',
    checkId:'chk-ground',
    countId:'count-ground',
    numberKeys:['hydrant_no','no','No','id','uid']
  }
];

let map;
let allItems = [];
let layers = {};

// 下諏訪町GISの点データをLeaflet/OSM上へ合わせるための補正。
// バス停ビューアで使った「日本測地系→WGS84補正」と同じ考え方。
function tokyoDatumToWgs84(lat, lon){
  const latNum = Number(lat);
  const lonNum = Number(lon);
  return {
    lat: latNum - latNum * 0.00010695 + lonNum * 0.000017464 + 0.0046017,
    lon: lonNum - latNum * 0.000046038 - lonNum * 0.000083043 + 0.010040
  };
}

function getLatLon(row){
  const rawLat = row.latitude ?? row.center_latitude ?? row.lat;
  const rawLon = row.longitude ?? row.center_longitude ?? row.lon ?? row.lng;
  if(rawLat === undefined || rawLon === undefined) return null;
  const lat = Number(rawLat), lon = Number(rawLon);
  if(!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
  const corrected = tokyoDatumToWgs84(lat, lon);
  return {rawLat:lat, rawLon:lon, lat:corrected.lat, lon:corrected.lon};
}

function pickNumber(row, dataset){
  for(const key of dataset.numberKeys){
    if(row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') return String(row[key]);
  }
  return '';
}

function makeIcon(color){
  return L.divIcon({
    className:'',
    html:`<div style="width:18px;height:18px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,.96);box-shadow:0 2px 8px rgba(0,0,0,.28)"></div>`,
    iconSize:[18,18],
    iconAnchor:[9,9]
  });
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function popupHtml(item){
  const no = item.no ? ` No.${escapeHtml(item.no)}` : '';
  const address = item.row.address ? `<div class="popup-meta">住所：${escapeHtml(item.row.address)}</div>` : '';
  return `
    <div class="popup-title">${escapeHtml(item.label)}${no}</div>
    ${address}
    <div class="popup-meta">緯度：${item.lat.toFixed(6)} / 経度：${item.lon.toFixed(6)}</div>
  `;
}

function searchableText(item){
  return [
    item.label,
    item.no,
    item.row.category,
    item.row.layer_name,
    item.row.address,
    item.row.uid
  ].filter(Boolean).join(' ').toLowerCase();
}

async function loadJson(file){
  const res = await fetch(file, {cache:'no-store'});
  if(!res.ok) throw new Error(`${file} を読み込めませんでした。`);
  return await res.json();
}

async function init(){
  map = L.map('map', {zoomControl:true}).setView([36.075,138.092],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  for(const ds of DATASETS){
    layers[ds.key] = L.layerGroup().addTo(map);
    const rows = await loadJson(ds.file);
    for(const row of rows){
      const pos = getLatLon(row);
      if(!pos) continue;
      allItems.push({
        key:ds.key,
        label:ds.label,
        color:ds.color,
        no:pickNumber(row, ds),
        row,
        rawLat:pos.rawLat,
        rawLon:pos.rawLon,
        lat:pos.lat,
        lon:pos.lon
      });
    }
  }

  bindEvents();
  render();
  setTimeout(()=>map.invalidateSize(), 100);
  // 初回読み込み時だけ、全ポイントが見える範囲に合わせる。
  setTimeout(()=>fitVisible(), 200);
}

function render(){
  Object.values(layers).forEach(layer => layer.clearLayers());
  const q = document.getElementById('search').value.trim().toLowerCase();
  const visibleItems = [];

  for(const ds of DATASETS){
    const checked = document.getElementById(ds.checkId).checked;
    const items = allItems.filter(item => item.key === ds.key);
    document.getElementById(ds.countId).textContent = items.length;

    if(!checked) continue;

    for(const item of items){
      if(q && !searchableText(item).includes(q)) continue;
      const marker = L.marker([item.lat, item.lon], {icon:makeIcon(item.color)})
        .bindTooltip(`${item.label}${item.no ? ' No.' + item.no : ''}`)
        .bindPopup(popupHtml(item));
      marker.addTo(layers[item.key]);
      visibleItems.push(item);
    }
  }

  document.getElementById('count-total').textContent = visibleItems.length;
}

function fitVisible(){
  const points = [];
  Object.values(layers).forEach(layer => {
    layer.eachLayer(marker => points.push(marker.getLatLng()));
  });
  if(points.length){
    map.fitBounds(L.latLngBounds(points).pad(0.08), {padding:[20,20]});
  }else{
    map.setView([36.075,138.092],14);
  }
}

function bindEvents(){
  DATASETS.forEach(ds => {
    document.getElementById(ds.checkId).addEventListener('change', () => {
      // 表示切替では、現在見ている地図の位置・ズームを維持する。
      const center = map.getCenter();
      const zoom = map.getZoom();
      render();
      map.setView(center, zoom, {animate:false});
    });
  });
  document.getElementById('search').addEventListener('input', () => {
    // 検索中も、勝手に地図位置を戻さない。
    const center = map.getCenter();
    const zoom = map.getZoom();
    render();
    map.setView(center, zoom, {animate:false});
  });
  document.getElementById('showAll').addEventListener('click', () => {
    const center = map.getCenter();
    const zoom = map.getZoom();
    DATASETS.forEach(ds => document.getElementById(ds.checkId).checked = true);
    render();
    map.setView(center, zoom, {animate:false});
  });
  document.getElementById('hideAll').addEventListener('click', () => {
    const center = map.getCenter();
    const zoom = map.getZoom();
    DATASETS.forEach(ds => document.getElementById(ds.checkId).checked = false);
    render();
    map.setView(center, zoom, {animate:false});
  });
  window.addEventListener('resize', () => map.invalidateSize());
}

init().catch(err => {
  console.error(err);
  document.querySelector('.side').insertAdjacentHTML('afterbegin',
    `<section class="card"><div class="warn">${escapeHtml(err.message)}</div></section>`);
});
</script>
</body>
</html>
