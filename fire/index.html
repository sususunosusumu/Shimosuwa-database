<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下諏訪町 防火水槽・消火栓マップ</title>
  <meta name="description" content="下諏訪町の防火水槽、地下式消火栓、地上式消火栓の位置を地図上で確認できるマップです。" />
  <meta name="keywords" content="下諏訪町,防火水槽,消火栓,地上式消火栓,地下式消火栓,GIS,地図" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ7C9tLY0PCLsdlVLP84eEuWHg=" crossorigin="" />

  <style>
    :root {
      --blue: #2563eb;
      --red: #dc2626;
      --orange: #f97316;
      --ink: #0f172a;
      --muted: #64748b;
      --bg: #f8fafc;
      --card: rgba(255, 255, 255, 0.94);
      --line: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    header {
      padding: 18px 22px 14px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: clamp(20px, 3vw, 30px);
      letter-spacing: 0.02em;
    }

    header p {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      height: calc(100dvh - 86px);
      min-height: 620px;
    }

    aside {
      padding: 16px;
      background: #ffffff;
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      background: var(--card);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      user-select: none;
    }

    .filter-row:last-child { border-bottom: 0; }

    .filter-row input { transform: scale(1.15); }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
    }

    .dot.blue { background: var(--blue); }
    .dot.red { background: var(--red); }
    .dot.orange { background: var(--orange); }

    .count-grid {
      display: grid;
      gap: 8px;
    }

    .count-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #eef2f7;
      font-size: 14px;
    }

    .count-card strong {
      font-size: 20px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: white;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #f1f5f9; }

    .note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 620px;
      z-index: 1;
      position: relative;
      overflow: hidden;
      background: #e5edf4;
    }

    .marker-pin {
      width: 18px;
      height: 18px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.35);
    }

    .marker-pin::after {
      content: "";
      width: 6px;
      height: 6px;
      margin: 4px 0 0 4px;
      background: rgba(255,255,255,0.9);
      position: absolute;
      border-radius: 50%;
    }

    .pin-blue { background: var(--blue); }
    .pin-red { background: var(--red); }
    .pin-orange { background: var(--orange); }

    .popup-title {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .popup-line {
      font-size: 12px;
      color: #475569;
      margin: 2px 0;
    }

    .leaflet-control-layers {
      border-radius: 12px;
      overflow: hidden;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        min-height: calc(100dvh - 106px);
      }

      #map {
        height: 70vh;
        min-height: 420px;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 290px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>下諏訪町 防火水槽・消火栓マップ</h1>
    <p>防火水槽・地下式消火栓・地上式消火栓の位置を地図上で確認できます。</p>
  </header>

  <main class="layout">
    <aside>
      <section class="panel">
        <h2>表示切替</h2>
        <label class="filter-row">
          <input type="checkbox" id="toggle-tanks" checked />
          <span class="dot blue"></span>
          <span>防火水槽</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="toggle-underground" checked />
          <span class="dot red"></span>
          <span>地下式消火栓</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="toggle-ground" checked />
          <span class="dot orange"></span>
          <span>地上式消火栓</span>
        </label>

        <div class="actions">
          <button type="button" id="show-all">すべて表示</button>
          <button type="button" id="hide-all">すべて非表示</button>
        </div>
      </section>

      <section class="panel">
        <h2>件数</h2>
        <div class="count-grid">
          <div class="count-card"><span>防火水槽</span><strong id="count-tanks">-</strong></div>
          <div class="count-card"><span>地下式消火栓</span><strong id="count-underground">-</strong></div>
          <div class="count-card"><span>地上式消火栓</span><strong id="count-ground">-</strong></div>
          <div class="count-card"><span>表示中 合計</span><strong id="count-visible">-</strong></div>
        </div>
      </section>

      <section class="panel">
        <h2>凡例</h2>
        <p class="note">
          青：防火水槽<br>
          赤：地下式消火栓<br>
          オレンジ：地上式消火栓<br><br>
          マーカーをクリックすると、種別・番号・緯度経度を確認できます。
        </p>
      </section>
    </aside>

    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    const DATASETS = {
      tanks: {
        label: "防火水槽",
        colorClass: "pin-blue",
        file: "./GIS/shimosuwa_fire_water_tanks.json",
        group: L.layerGroup(),
        checkboxId: "toggle-tanks",
        countId: "count-tanks"
      },
      underground: {
        label: "地下式消火栓",
        colorClass: "pin-red",
        file: "./GIS/shimosuwa_underground_hydrants.json",
        group: L.layerGroup(),
        checkboxId: "toggle-underground",
        countId: "count-underground"
      },
      ground: {
        label: "地上式消火栓",
        colorClass: "pin-orange",
        file: "./GIS/shimosuwa_ground_hydrants.json",
        group: L.layerGroup(),
        checkboxId: "toggle-ground",
        countId: "count-ground"
      }
    };

    const map = L.map("map", {
      preferCanvas: true,
      zoomControl: true
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    map.setView([36.075, 138.085], 14);

    function makeIcon(colorClass) {
      return L.divIcon({
        className: "",
        html: `<div class="marker-pin ${colorClass}"></div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 20],
        popupAnchor: [0, -18]
      });
    }

    function getLatLng(item) {
      const lat = Number(item.latitude ?? item.center_latitude);
      const lng = Number(item.longitude ?? item.center_longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      return [lat, lng];
    }

    function getNo(item) {
      return item.tank_no || item.hydrant_no || item.no || item.uid || "";
    }

    function makePopup(item, label) {
      const no = getNo(item);
      const lat = Number(item.latitude ?? item.center_latitude);
      const lng = Number(item.longitude ?? item.center_longitude);
      const address = item.address ? `<div class="popup-line">住所：${escapeHtml(item.address)}</div>` : "";
      return `
        <div class="popup-title">${escapeHtml(label)}${no ? " No." + escapeHtml(no) : ""}</div>
        ${address}
        <div class="popup-line">緯度：${lat.toFixed(6)}</div>
        <div class="popup-line">経度：${lng.toFixed(6)}</div>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadDataset(key, boundsAccumulator) {
      const dataset = DATASETS[key];

      try {
        const response = await fetch(dataset.file);
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);

        const data = await response.json();
        let validCount = 0;

        data.forEach(item => {
          const latlng = getLatLng(item);
          if (!latlng) return;

          validCount++;
          boundsAccumulator.push(latlng);

          L.marker(latlng, { icon: makeIcon(dataset.colorClass) })
            .bindPopup(makePopup(item, dataset.label))
            .addTo(dataset.group);
        });

        document.getElementById(dataset.countId).textContent = validCount;
        dataset.total = validCount;
        dataset.group.addTo(map);
      } catch (error) {
        console.error(`Failed to load ${dataset.file}`, error);
        document.getElementById(dataset.countId).textContent = "読込失敗";
        dataset.total = 0;
      }
    }

    function updateLayerVisibility() {
      let visibleTotal = 0;

      Object.values(DATASETS).forEach(dataset => {
        const checked = document.getElementById(dataset.checkboxId).checked;

        if (checked) {
          if (!map.hasLayer(dataset.group)) dataset.group.addTo(map);
          visibleTotal += dataset.total || 0;
        } else {
          if (map.hasLayer(dataset.group)) map.removeLayer(dataset.group);
        }
      });

      document.getElementById("count-visible").textContent = visibleTotal;
    }

    function setAll(checked) {
      Object.values(DATASETS).forEach(dataset => {
        document.getElementById(dataset.checkboxId).checked = checked;
      });
      updateLayerVisibility();
    }

    async function init() {
      const allBounds = [];

      await Promise.all(Object.keys(DATASETS).map(key => loadDataset(key, allBounds)));

      if (allBounds.length > 0) {
        const bounds = L.latLngBounds(allBounds);
        map.invalidateSize(true);
        map.fitBounds(bounds, { padding: [28, 28], maxZoom: 15 });

        // GitHub Pages / browser rendering timing can make Leaflet calculate
        // the map size too early. Recalculate once more after layout is settled.
        setTimeout(() => {
          map.invalidateSize(true);
          map.fitBounds(bounds, { padding: [28, 28], maxZoom: 15 });
        }, 300);
      }

      Object.values(DATASETS).forEach(dataset => {
        document.getElementById(dataset.checkboxId).addEventListener("change", updateLayerVisibility);
      });

      document.getElementById("show-all").addEventListener("click", () => setAll(true));
      document.getElementById("hide-all").addEventListener("click", () => setAll(false));

      updateLayerVisibility();
    }

    init();
  </script>
</body>
</html>
